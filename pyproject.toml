[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gacha-planner"
version = "0.1.0"
description = "Resource planner and probability calculator for gacha games"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
images = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "matplotlib>=3.8", "Pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["core*", "storage*", "ui*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["core", "storage", "ui", "services", "tests", "main.py"]

# matplotlib ships partial annotations without a complete py.typed marker, so it is treated as Any.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
